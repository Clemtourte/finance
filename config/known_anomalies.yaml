  note: "+32,1% à 0,555 EUR. Plus bas historique de la série : amplitude relative maximale."

- ticker: ALKAL.PA
  kind: outlier
  date: 2025-07-11
  note: "+49,6% à 0,718 EUR. Régime de cours effondré."

- ticker: ALKAL.PA
  kind: outlier
  date: 2025-09-11
  note: "+39,4% à 0,74 EUR. Régime de cours effondré."

- ticker: ALKAL.PA
  kind: outlier
  date: 2025-09-25
  note: "+51,4% à 1,27 EUR. Régime de cours effondré."

- ticker: ALKAL.PA

# Univers personnel — lignes réellement détenues (PEA Boursorama).
#
# Liste NON EXHAUSTIVE : d'autres lignes existent sur le compte et
# devront être ajoutées ici. Arrêtée au 2026-07-29.
#
# --- Convention spread_pct ---
# spread_pct est le DEMI-SPREAD : le coût supporté d'un seul côté de
# l'aller-retour. Le moteur (src/engine/costs.py) l'applique
# symétriquement à l'achat et à la vente, donc le coût total d'un
# aller-retour vaut 2 x spread_pct.
# Mesure depuis un carnet d'ordres :  (vente - achat) / (vente + achat)
#
# ⚠️ Toutes les valeurs ci-dessous sont des PLACEHOLDERS non mesurés,
# sauf mention contraire. Ordres de grandeur, pas des chiffres à
# prendre au sérieux — particulièrement sur les small caps, où le
# spread est le poste de coût dominant.
#
# --- Convention ttf ---
# La TTF ne frappe que les sociétés françaises dont la capitalisation
# dépasse 1 Md€, admises sur un marché réglementé. Les parts d'ETF n'y
# sont jamais soumises. 2CRSI et Kalray sont cotées sur Euronext Growth
# (système multilatéral de négociation, pas un marché réglementé) et
# sont très en deçà du seuil de capitalisation : ttf=false sur les deux
# critères. À VÉRIFIER contre la liste officielle publiée par la DGFiP.
#
# --- Limites d'historique (relevé du 2026-07-29) ---
# DCAM.PA  : 358 séances depuis 2025-03-04 → NON BACKTESTABLE.
#            Ingéré et suivi, mais à exclure de tout backtest : un
#            découpage in-sample/out-of-sample n'a aucun sens sur
#            16 mois.
# PAEEM.PA / PANX.PA : démarrent tous deux le 2019-04-25. Leurs
#            dénominations actuelles ("ESG Transition", "Screened")
#            suggèrent un changement d'indice de référence en cours de
#            vie. Si c'est confirmé (DICI Amundi), l'historique
#            antérieur au changement porte sur un autre sous-jacent et
#            ne doit pas être backtesté. Aucun contrôle de
#            src/data/validation.py ne peut détecter ce cas : les prix
#            restent continus et plausibles.


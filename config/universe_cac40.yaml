# Univers de valeurs éligibles PEA - composition du CAC 40.
#
# Tickers au format Yahoo Finance (suffixe .PA pour Euronext Paris).
# Composition arrêtée au 2026-07-24 (source : révision trimestrielle du
# Conseil scientifique des indices, dernière entrée en vigueur le
# 2025-12-22 : sortie d'Edenred, entrée d'Eiffage). À revérifier à chaque
# révision trimestrielle (mars, juin, septembre, décembre) car la
# composition peut changer.
#
# ttf : éligibilité à la taxe sur les transactions financières (France),
# déduite du préfixe ISIN (FR = domicilié en France = éligible ; NL/LU =
# non éligible). À VÉRIFIER contre la liste officielle publiée chaque
# année par la DGFiP (sociétés françaises dont la capitalisation dépasse
# 1 milliard d'euros) : le préfixe ISIN est une heuristique raisonnable,
# pas une source faisant foi.
#
# spread_pct : place-holder uniforme (0,03%) en attendant un calibrage
# par titre à partir de données de carnet d'ordres réelles ; les grandes
# capitalisations du CAC 40 ont en pratique un spread plus resserré que
# ce chiffre, mais une valeur uniforme évite une fausse précision.
tickers:
  - ticker: AC.PA
    name: Accor
    isin: FR0000120404
    ttf: true
    spread_pct: 0.0003
